name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./bubble-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Зависимости
        run: pip install -r requirements.txt pytest httpx
      - name: Тесты
        run: python -m pytest -q
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./bubble-dashboard-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bubble-dashboard-ui/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (вся история)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
